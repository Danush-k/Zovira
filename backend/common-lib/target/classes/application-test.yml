spring:
  main:
    banner-mode: off

logging:
  level:
    root: WARN
    com.zovira: INFO

zovira:
  security:
    jwt:
      secret: test-only-zovira-jwt-secret-0123456789abcdefghijklmnop
    cookie:
      secure: false
    rate-limit:
      enabled: false
    password:
      bcrypt-strength: 4
  storage:
    local:
      root: ${java.io.tmpdir}/zovira-test-uploads
  seed:
    enabled: false
